name: Build image and push Helm chart

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - run_sse.py
      - chart/**
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tags
        id: vars
        run: |
          TS="$(date -u +%Y%m%d%H%M%S)"
          echo "tag=0.1.0-${TS}" >> "$GITHUB_OUTPUT"

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/geoberle/bambu-mcp:latest
            ${{ env.REGISTRY }}/geoberle/bambu-mcp:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Package and push Helm chart
        run: |
          TAG="${{ steps.vars.outputs.tag }}"
          sed -i "s/^version:.*/version: ${TAG}/" chart/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${TAG}\"/" chart/Chart.yaml
          helm package chart/
          helm push bambu-mcp-chart-*.tgz oci://${{ env.REGISTRY }}/geoberle
