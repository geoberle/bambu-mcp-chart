apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bambu-mcp.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: mcp
      protocol: TCP
      name: mcp
    - port: {{ .Values.camera.apiPort }}
      targetPort: camera-api
      protocol: TCP
      name: camera-api
    {{- range $port := until (int (add1 (sub .Values.camera.streamPortEnd .Values.camera.streamPortStart))) }}
    - port: {{ add $.Values.camera.streamPortStart $port }}
      targetPort: stream-{{ add $.Values.camera.streamPortStart $port }}
      protocol: TCP
      name: stream-{{ add $.Values.camera.streamPortStart $port }}
    {{- end }}
  selector:
    {{- include "bambu-mcp.selectorLabels" . | nindent 4 }}
