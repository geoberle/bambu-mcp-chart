apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bambu-mcp.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "bambu-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bambu-mcp.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: mcp-server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: BAMBU_PUBLIC_HOST
              value: "{{ .Chart.Name }}.{{ .Release.Namespace }}.svc.cluster.local"
            - name: BAMBU_API_PORT
              value: {{ .Values.camera.apiPort | quote }}
            - name: BAMBU_PORT_POOL_START
              value: {{ .Values.camera.streamPortStart | quote }}
            - name: BAMBU_PORT_POOL_END
              value: {{ .Values.camera.streamPortEnd | quote }}
            - name: PRINTER_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: name
            - name: PRINTER_IP
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: ip
            - name: PRINTER_SERIAL
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: serial
            - name: PRINTER_ACCESS_CODE
              valueFrom:
                secretKeyRef:
                  name: {{ .Chart.Name }}-credentials
                  key: accessCode
          ports:
            - name: mcp
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            - name: camera-api
              containerPort: {{ .Values.camera.apiPort }}
              protocol: TCP
            {{- range $port := until (int (add1 (sub .Values.camera.streamPortEnd .Values.camera.streamPortStart))) }}
            - name: stream-{{ add $.Values.camera.streamPortStart $port }}
              containerPort: {{ add $.Values.camera.streamPortStart $port }}
              protocol: TCP
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
